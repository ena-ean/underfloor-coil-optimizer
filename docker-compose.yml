# The image already carries NODE_ENV, the telemetry switch and the HEALTHCHECK,
# so nothing has to be repeated here.
services:
  coil-optimizer:
    build: .
    image: enaresearch/underfloor-coil-optimizer:latest
    container_name: coil-optimizer
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

